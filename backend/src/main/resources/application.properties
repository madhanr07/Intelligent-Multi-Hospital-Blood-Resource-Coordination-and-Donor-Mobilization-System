# Application Name
spring.application.name=blood-resource-coordination-backend

# Server Configuration
server.port=8080

# Database Configuration
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:hemonexus}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Flyway Configuration
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# Actuator Configuration
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=when-authorized

# JWT Configuration
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration=${JWT_EXPIRATION_MS:28800000}

# Initial Institution Bootstrap Configuration
app.institution.name=${INITIAL_INSTITUTION_NAME:}
app.institution.code=${INITIAL_INSTITUTION_CODE:}

# Initial Admin Bootstrap Configuration
app.admin.username=${INITIAL_ADMIN_USERNAME:}
app.admin.password=${INITIAL_ADMIN_PASSWORD:}

# CORS Configuration (for development)
# This will be overridden by WebConfig for more control
